repos:

- repo: local
  hooks:

  - id: generate-init
    name: Generates __init__.py files
    language: python
    entry: python hooks/generate_init.py
    require_serial: true
    additional_dependencies: ["mkinit==1.2.0", "ruff==0.15.16", "rich"]
    
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-executables-have-shebangs
  - id: check-symlinks

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.16
  hooks:
    #Run the linter.
    - id: ruff
      types_or: [ python, pyi, jupyter ]
      args: [ --fix, --exit-zero ]
    #Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]
