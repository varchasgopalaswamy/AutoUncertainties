repos:

- repo: local
  hooks:
  - id: geninit
    name: Generate package initializers
    entry: uv run --locked --group ci geninit
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-executables-have-shebangs
  - id: check-symlinks

- repo: local
  hooks:
    - id: ruff-check
      name: Ruff check
      entry: uv run --locked --group ci ruff check --force-exclude
      language: system
      types_or: [python, pyi, jupyter]
      args: [--fix, --exit-non-zero-on-fix]
      require_serial: true
    - id: ruff-format
      name: Ruff format
      entry: uv run --locked --group ci ruff format --force-exclude
      language: system
      types_or: [python, pyi, jupyter]
      require_serial: true
    - id: pyrefly
      name: Pyrefly
      entry: uv run --locked --group ci pyrefly check
      language: system
      pass_filenames: false
      always_run: true
