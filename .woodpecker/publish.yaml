when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

depends_on:
  - test

steps:
  - name: publish-pypi
    image: python:3.14
    environment:
      PYPI_TOKEN:
        from_secret: pypi_token
    commands:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - git fetch --tags
      - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow; fi
      - ./scripts/ci/publish-pypi.sh
