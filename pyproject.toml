[project]
name = "auto_uncertainties"
authors = [
    {name = "Varchas Gopalaswamy", email = "vgop@lle.rochester.edu"},
    {name = "Ethan Mentzer", email = "ementzer@u.rochester.edu"},
]
description = "Linear Uncertainty Propagation with Auto-Differentiation"
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy >= 2.0",
    "jax >= 0.9",
    "jaxlib >= 0.9",
    "pydantic-settings >= 2.0, < 3",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "sphinx >= 4.1.2",
    "sphinx_rtd_theme >= 1.0.0",
    "sphinxcontrib-bibtex >= 2.3.1",
    "sphinxcontrib-napoleon >= 0.7",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "graphviz",
    "sphinx-autoapi",
    "furo",
]

[dependency-groups]
ci = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pint",
    "ruff>=0.17",
    "pyrefly>=0.58.0",
    "geninit>=0.2.0",
]

[build-system]
requires = ["setuptools >= 67.0.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "auto_uncertainties/_version.py"

[tool.setuptools.packages.find]
exclude = ["tests/*"]

[tool.geninit]
roots = ["auto_uncertainties"]

[tool.coverage.run]
source = ["./"]
omit =  ["*/test*", "*/*__init__.py", "*/_version.py"]


[tool.pytest.ini_options]
testpaths = ["tests"]

